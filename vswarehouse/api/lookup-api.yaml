        pctCodingCovered:
          type: "number"
          format: "double"
        cDot:
          type: "string"
          example: "c.1799T>A"
        pDot:
          type: "string"
          example: "p.V600E"
        pDotThreeLetter:
          type: "string"
          example: "p.Val600Glu"
        aaStart:
          type: "number"
          format: "int32"
        aaStop:
          type: "number"
          format: "int32"
        repeatAALength:
          type: "number"
          format: "int32"
      required:
        - "transcript"
        - "isDefaultTranscript"
        - "sequenceOntology"
        - "geneRegion"
        - "effect"
        - "distToStopCodon"

    AnnotationSource:
      type: "object"
      properties:
        sourceId:
          type: "string"
          description: "The ID of one of the built in sources, e.g. 'gene', 'reference', 'cytoband', 'hpo', 'mondo'"
        catalogId:
          type: "string"
          description: "Selects a catalog in the workspace catalogs folder by id (filename stem). Both the bare name and the per-build filename resolve, e.g. 'GeneLists' or 'GeneLists_GRCh_38'. Catalogs are not reachable through sourceUrl, which only scans watched annotation folders."
        series:
          type: "string"
          description: "The series name, e.g. 'ClinVar-NCBI'"
        version:
          type: "string"
          description: "The version of the series, e.g. '2025-05-01'. Defaults to latest for that series."
        sourceUrl:
          type: "string"
          description: "The source URL, e.g. 'ClinVar2025-05-01-NCBI_GRCh_37_g1k_Homo_sapiens.tsf:1' from local watched folder."
        transform:
          type: "string"
          description: "The transform function name, e.g. 'filterByExpr'. If this is a wrapper layer."
        params:
          type: "object"
          description: "Transform-specific parameters."
        transformSources:
          type: "array"
          items:
            $ref: "#/components/schemas/AnnotationSource"
            type: "object"
          description: "For recursive wrapping when using a transform function."

    SourceFieldEnum:
      type: "object"
      properties:
        name:
          type: "string"
        doc:
          type: "string"
      required:
        - "name"

    SourceField:
      type: "object"
      properties:
        idx:
          type: "number"
          format: "int32"
          description: "Index of this field in the source, -1, -2, -3 for chr, start, stop"
        name:
          type: "string"
          example: "Ref/Alt"
        symbol:
          type: "string"
          example: "RefAlt"
        dataType:
          type: "string"
          example: "s"
        enums:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceFieldEnum"
            type: "object"
        doc:
          type: "string"
          example: "The reference and alt allele"
        urlTemplate:
          type: "string"
          example: "https://www.ncbi.nlm.nih.gov/clinvar/variation/$$"
        isIndexed:
          type: "boolean"
          example: true
        isHtmlContent:
          type: "boolean"
          example: true
        props:
          type: "object"
        formatFlags:
          type: "array"
          items:
            type: "string"
      required:
        - "idx"
        - "name"
        - "symbol"
        - "dataType"

    SourceInfo:
      type: "object"
      properties:
        name:
          type: "string"
          example: "ClinVar 2025-05-01, NCBI"
        url:
          type: "string"
        uuid:
          type: "string"
        size:
          type: "number"
          format: "int32"
          description: "Size in bytes, -1 if unknown"
        seriesName:
          type: "string"
          example: "ClinVar-NCBI"
        sourceVersion:
          type: "string"
          example: "2025-05-01"
        description:
          type: "string"
        curatedBy:
          type: "string"
          example: "NCBI"
        entityCount:
          type: "number"
          format: "int32"
        locusCount:
          type: "number"
          format: "int32"
        isNetworkSource:
          type: "boolean"
          description: "Whether this source is a network/remote source (http, https, ftp, RFS, S3FS)"
        errMsg:
          type: "string"
          description: "Error message if source resolution failed or source is not readable"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceField"
            type: "object"
          description: "Only included if requested via includeFields param"
        coordSysId:
          type: "string"
          description: "Identifier of the coordinate system the source is mapped to, e.g. GRCh_38,Chromosome,Homo sapiens"
          example: "GRCh_38,Chromosome,Homo sapiens"
        featureType:
          $ref: "#/components/schemas/SourceFeatureType"
          type: "object"
          description: "The kind of features this source contains, e.g. TypeGene for gene/transcript tracks or TypeVariant for variant catalogs."
      required:
        - "name"
        - "url"
        - "isNetworkSource"

    LookupResponse:
      type: "object"
      properties:
        limit:
          type: "number"
          format: "int32"
        offset:
          type: "number"
          format: "int32"
        count:
          type: "number"
          format: "int32"
        hasMore:
          type: "boolean"
        took:
          type: "number"
          format: "int32"
        cursor:
          type: "string"
          description: "Opaque resume token for stateful paging"
        warning:
          type: "string"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceField"
            type: "object"
        fieldNames:
          type: "array"
          items:
            type: "string"
        recordIds:
          type: "array"
          items:
            type: "string"
        values:
          type: "array"
          items:
            type: "array"
            items:
              type: "object"
        objects:
          type: "array"
          items:
            type: "object"
      required:
        - "offset"
        - "count"
        - "hasMore"
        - "took"

    ConfigResponse:
      type: "object"
      properties:
        configGeneSource:
          type: "string"
        resolvedGeneSource:
          type: "string"
        configReferenceSource:
          type: "string"
        resolvedReferenceSource:
          type: "string"
      required:
        - "configGeneSource"
        - "resolvedGeneSource"
        - "configReferenceSource"
        - "resolvedReferenceSource"

    VariantQueryResponse:
      type: "object"
      properties:
        variants:
          type: "array"
          items:
            $ref: "#/components/schemas/RefAltVariant"
            type: "object"
        warning:
          type: "string"
        error:
          type: "string"
      required:
        - "variants"
        - "warning"
        - "error"

    GeneQueryResponse:
      type: "object"
      properties:
        genes:
          type: "array"
          items:
            $ref: "#/components/schemas/GeneDefinition"
            type: "object"
        error:
          type: "string"
      required:
        - "genes"
        - "error"

    CnvQueryResponse:
      type: "object"
      properties:
        cnv:
          $ref: "#/components/schemas/CopyNumberVariant"
          type: "object"
        warning:
          type: "string"
        error:
          type: "string"
      required:
        - "warning"
        - "error"

    BreakendQueryResponse:
      type: "object"
      properties:
        breakends:
          type: "array"
          items:
            $ref: "#/components/schemas/BreakendVariant"
            type: "object"
        warning:
          type: "string"
        error:
          type: "string"
      required:
        - "breakends"
        - "warning"
        - "error"

    RegionQueryResponse:
      type: "object"
      properties:
        region:
          $ref: "#/components/schemas/GenomicSegment"
          type: "object"
        warning:
          type: "string"
        error:
          type: "string"
      required:
        - "warning"
        - "error"

    OntologySearchResult:
      type: "object"
      properties:
        ids:
          type: "array"
          items:
            type: "string"
          description: "Matched ontology identifiers, e.g. 'HP:0001250' (HPO) or 'MONDO:0011076'."
        matches:
          type: "array"
          items:
            type: "string"
          description: "Human-readable disease/phenotype terms matched in the input text."
      required:
        - "ids"
        - "matches"

    ExtractDiseasesAndPhenotypesResponse:
      type: "object"
      properties:
        result:
          $ref: "#/components/schemas/OntologySearchResult"
          type: "object"
        error:
          type: "string"
      required:
        - "result"
        - "error"

    ExpressionNode:
      type: "object"
      properties:
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/ExpressionNode"
            type: "object"
          description: "Used by And, Or, Not, and AlignedArrayMatch."
        field:
          type: "string"
          example: "Classification"
        op:
          $ref: "#/components/schemas/OperatorType"
          type: "object"
          description: "And, Or, Not, Equals, NotEquals, LessThan, LessThanOrEqual, GreaterThan, GreaterThanOrEqual, StartsWith, EndsWith, Substring, IsNull, IsNotNull, AlignedArrayMatch"
        value:
          type: "string"
          example: "Pathogenic"
      required:
        - "op"

    FormatOption:
      type: "string"
      enum:
        - "values"
        - "objects"
        - "fieldNames"
        - "fieldMetas"
        - "recordIds"
        - "recordErrors"
        - "serializedQuery"

    GenomicQueryMode:
      type: "string"
      enum:
        - "Exact"
        - "Overlaps"
        - "Contains"
        - "Within"

    OperatorType:
      type: "string"
      enum:
        - "Or"
        - "And"
        - "Not"
        - "Equals"
        - "NotEquals"
        - "LessThan"
        - "LessThanOrEqual"
        - "GreaterThan"
        - "GreaterThanOrEqual"
        - "StartsWith"
        - "EndsWith"
        - "Substring"
        - "IsNull"
        - "IsNotNull"
        - "AlignedArrayMatch"
