openapi: '3.0.2'
info:
  title: Lookup API
  version: '1.0.0'
  description: 'Provides endpoints for workspace lookups, including variant details, CNV data, region queries, and source availability for downloads.'

externalDocs:
  url: '/docs/api-docs'
  description: API Documentation

servers:
  - url: '/w/my_workspace/api/lookup'




paths:
  /:
    get:
      operationId: "config"
      summary: "Report the workspace's configured and resolved gene/reference sources."
      description: "Internal diagnostic that echoes the configured versus resolved gene and reference annotation sources for the workspace build. Not a general lookup; use listSources to enumerate available sources."
      x-agent-expose: "hidden"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
                type: "object"
  /resolve:
    post:
      operationId: "resolveAnnotationSource"
      summary: "Resolve an annotation source specification to concrete metadata."
      description: "Resolves an AnnotationSource (built-in id, series, or catalog reference) to its concrete SourceInfo: name, URL, version, coordinate system, feature type, entity/locus counts, and optionally its field schema. Use after listSources when you need the fields of a specific source, or to confirm a source is readable before querying it with genomicQuery/tableLookup/tableRead."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "source"
              properties:
                source:
                  $ref: "#/components/schemas/AnnotationSource"
                  type: "object"
                  description: "Source of the annotation."
                includeFields:
                  type: "boolean"
                  description: "Include the list of source fields in the response."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInfo"
                type: "object"
  /download:
    post:
      operationId: "download"
      summary: "Start downloading an annotation source to the local cache."
      description: "Initiates a background download of a network annotation source and returns a processId (empty string when nothing needs downloading); poll /ps/{processId} for status. Side-effecting infrastructure operation."
      x-agent-expose: "hidden"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "source"
              properties:
                source:
                  $ref: "#/components/schemas/AnnotationSource"
                  type: "object"
                  description: "Source of the annotation."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /sources:
    get:
      operationId: "listSources"
      summary: "List annotation sources available in the workspace."
      description: "Enumerates the annotation sources (built-in and watched-folder catalogs) available for the workspace build, with metadata for each (name, series, version, feature type, coordinate system, counts). Start here to discover what data can be queried, then feed a source into resolveAnnotationSource, genomicQuery, tableLookup, or tableRead. Use the filter params to narrow large source lists."
      x-agent-expose: "promoted"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "versionMode"
          in: "query"
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceVersionMode"
          description: "Whether to return only the latest version per series (LatestOnly) or all versions (All). Sources without a series are always included."

        - name: "series"
          in: "query"
          required: false
          schema:
            type: "string"
            description: "Exact series name filter. If provided, only sources with this seriesName are returned."
          description: "Exact series name filter. If provided, only sources with this seriesName are returned."

        - name: "nameContains"
          in: "query"
          required: false
          schema:
            type: "string"
            description: "Case-insensitive substring filter applied to the source display name."
          description: "Case-insensitive substring filter applied to the source display name."

        - name: "featureType"
          in: "query"
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFeatureType"
          description: "Filter to sources of one feature type. For the gene/transcript annotation track use TypeGene; for variant catalogs use TypeVariant."

        - name: "isNetworkSource"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If provided, filters to only network sources (true) or only local sources (false)."
          description: "If provided, filters to only network sources (true) or only local sources (false)."

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SourceInfo"
                  type: "object"
  /variant:
    get:
      operationId: "variantQuery"
      summary: "Parse a free-text variant query into normalized ref/alt variants."
      description: "Resolves a small-variant description into one or more normalized genomic ref/alt variants for the workspace build. Accepts many notations: coordinate+alleles (e.g. 'chr1:12345 A/T'), genomic HGVS (e.g. 'chr4:g.1803568C>G'), protein HGVS with a transcript (e.g. 'NM_000546(TP53):p.Arg175Leu'), protein-change shorthand (e.g. 'BRAF V600E', which may expand to multiple codon-level variants), dbSNP rsIDs (e.g. 'rs17337177'), and ClinVar VCV IDs. The primary tool for turning a user's variant string into coordinates."
      x-agent-expose: "promoted"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "BRAF V600E"
            description: "Free-text variant to parse: coordinate+alleles, genomic/protein HGVS, GENE p.Change shorthand, rsID, or VCV ID."
          description: "Free-text variant to parse: coordinate+alleles, genomic/protein HGVS, GENE p.Change shorthand, rsID, or VCV ID."
          example: "BRAF V600E"

        - name: "genePrefSourceId"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "GenePreferences"
            description: "Catalog id of the gene preferences catalog to consult when resolving a gene name to its preferred transcript. Defaults to the workspace's GenePreferences catalog."
          description: "Catalog id of the gene preferences catalog to consult when resolving a gene name to its preferred transcript. Defaults to the workspace's GenePreferences catalog."
          example: "GenePreferences"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantQueryResponse"
                type: "object"
  /gene:
    get:
      operationId: "geneQuery"
      summary: "Find genes by symbol, alias, or numeric gene ID."
      description: "Resolves a gene by HGNC symbol, alias, or numeric RefSeq/Entrez GeneID and returns matching gene definitions with coordinates and aliases for the workspace build. The primary tool for turning a gene name into a gene ID and locus. Use includePrefixMatches for autocomplete-style prefix search and includeAliases to also match on alias symbols."
      x-agent-expose: "promoted"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "BRCA1"
            description: "The gene name, alias, or gene ID to search for."
          description: "The gene name, alias, or gene ID to search for."
          example: "BRCA1"

        - name: "includePrefixMatches"
          in: "query"
          required: true
          schema:
            type: "boolean"
            description: "If true, include genes whose names start with the query (e.g., \"brca\" matches \"BRCA1\" and \"BRCA2\"). If false, only exact matches are returned. Defaults to false."
          description: "If true, include genes whose names start with the query (e.g., \"brca\" matches \"BRCA1\" and \"BRCA2\"). If false, only exact matches are returned. Defaults to false."

        - name: "includeAliases"
          in: "query"
          required: true
          schema:
            type: "boolean"
            description: "If true, include search results for this query as a gene alias (exact matches only)."
          description: "If true, include search results for this query as a gene alias (exact matches only)."

        - name: "limit"
          in: "query"
          required: true
          schema:
            type: "number"
            format: "int32"
            description: "Max number of genes to return. Defaults to 10."
          description: "Max number of genes to return. Defaults to 10."

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneQueryResponse"
                type: "object"
  /variant/transcript:
    get:
      operationId: "variantTranscript"
      summary: "Annotate a variant against a specific (or default) transcript."
      description: "Computes the transcript-level consequence of a ref/alt variant: sequence ontology term, coding/protein HGVS (c./p.), affected exon, amino-acid change, and distances. If transcriptName is omitted, the gene's default transcript is used. Obtain a RefAltVariant from variantQuery first."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "variant"
          in: "query"
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefAltVariant"
          description: "Normalized ref/alt variant, as returned by variantQuery."

        - name: "transcriptName"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "NM_004333"
            description: "RefSeq transcript to annotate against; if omitted, the gene's default transcript is used."
          description: "RefSeq transcript to annotate against; if omitted, the gene's default transcript is used."
          example: "NM_004333"

        - name: "starForTer"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, spell a stop gain as '*' (p.Trp26*) rather than Ter (p.Trp26Ter), which is the default. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."
          description: "If true, spell a stop gain as '*' (p.Trp26*) rather than Ter (p.Trp26Ter), which is the default. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."

        - name: "starForFrameshiftTer"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, spell a frameshift's new termination codon as '*' (p.Arg83Glnfs*6) rather than the HGVS-recommended Ter (p.Arg83GlnfsTer6), which is the default. Independent of starForTer. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."
          description: "If true, spell a frameshift's new termination codon as '*' (p.Arg83Glnfs*6) rather than the HGVS-recommended Ter (p.Arg83GlnfsTer6), which is the default. Independent of starForTer. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."

        - name: "startCodonUnknown"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, render an initiator codon variant as p.Met1? rather than naming the substituted residue (p.Met1Trp), which is the default. Affects pDotThreeLetter only."
          description: "If true, render an initiator codon variant as p.Met1? rather than naming the substituted residue (p.Met1Trp), which is the default. Affects pDotThreeLetter only."

        - name: "showDeletedBases"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, cDot names the deleted bases (c.51delA) rather than using the bare HGVS form (c.51del), which is the default."
          description: "If true, cDot names the deleted bases (c.51delA) rather than using the bare HGVS form (c.51del), which is the default."

        - name: "enableRepeatNotation"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, a variant lying in a tandem repeat is rendered in cDot with HGVS repeat notation (c.337GAG[4]) rather than as a plain deletion (c.337GAGdel), which is the default."
          description: "If true, a variant lying in a tandem repeat is rendered in cDot with HGVS repeat notation (c.337GAG[4]) rather than as a plain deletion (c.337GAGdel), which is the default."

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantTranscript"
                type: "object"
  /variant/gdot:
    get:
      operationId: "variantGDot"
      summary: "Compute genomic HGVS (g.) for a variant, with right-aligned form."
      description: "Returns the genomic-level HGVS (g.) notation for a ref/alt variant, plus its right-aligned (3'-shifted) representation and that variant's g. notation. Use to normalize a variant to canonical g. HGVS."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "variant"
          in: "query"
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefAltVariant"
          description: "Normalized ref/alt variant, as returned by variantQuery."

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantGDot"
                type: "object"
  /variant/overlap/transcripts:
    get:
      operationId: "variantOverlapTranscripts"
      summary: "List every transcript a variant overlaps, each with its consequence."
      description: "Returns one annotation per transcript overlapping the variant's locus (sequence ontology, c./p. HGVS, exon, AA change), rather than only the default transcript as in variantTranscript. Use when you need every transcript's effect for a variant."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "variant"
          in: "query"
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefAltVariant"
          description: "Normalized ref/alt variant, as returned by variantQuery."

        - name: "starForTer"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, spell a stop gain as '*' (p.Trp26*) rather than Ter (p.Trp26Ter), which is the default. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."
          description: "If true, spell a stop gain as '*' (p.Trp26*) rather than Ter (p.Trp26Ter), which is the default. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."

        - name: "starForFrameshiftTer"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, spell a frameshift's new termination codon as '*' (p.Arg83Glnfs*6) rather than the HGVS-recommended Ter (p.Arg83GlnfsTer6), which is the default. Independent of starForTer. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."
          description: "If true, spell a frameshift's new termination codon as '*' (p.Arg83Glnfs*6) rather than the HGVS-recommended Ter (p.Arg83GlnfsTer6), which is the default. Independent of starForTer. Affects pDotThreeLetter only; pDot is one-letter and always uses '*'."

        - name: "startCodonUnknown"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, render an initiator codon variant as p.Met1? rather than naming the substituted residue (p.Met1Trp), which is the default. Affects pDotThreeLetter only."
          description: "If true, render an initiator codon variant as p.Met1? rather than naming the substituted residue (p.Met1Trp), which is the default. Affects pDotThreeLetter only."

        - name: "showDeletedBases"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, cDot names the deleted bases (c.51delA) rather than using the bare HGVS form (c.51del), which is the default."
          description: "If true, cDot names the deleted bases (c.51delA) rather than using the bare HGVS form (c.51del), which is the default."

        - name: "enableRepeatNotation"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, a variant lying in a tandem repeat is rendered in cDot with HGVS repeat notation (c.337GAG[4]) rather than as a plain deletion (c.337GAGdel), which is the default."
          description: "If true, a variant lying in a tandem repeat is rendered in cDot with HGVS repeat notation (c.337GAG[4]) rather than as a plain deletion (c.337GAGdel), which is the default."

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/VariantTranscript"
                  type: "object"
  /cnv:
    get:
      operationId: "cnvQuery"
      summary: "Parse a free-text CNV query into a copy-number variant."
      description: "Resolves a copy-number description into a single CNV (chr/start/stop plus gain/loss/LOH type) for the workspace build. Accepts gene/exon spans (e.g. 'BRCA2 exon 3-5 deletion'), cytoband notation (e.g. 'del(17p13.1)'), coordinate ranges (e.g. '13:32,910,400-32,953,500 loss'), and transcript c. dup/del HGVS (e.g. 'NM_000059.4:c.1913_8762dup')."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "BRCA2 exon 3-5 deletion"
            description: "Free-text CNV to parse: gene/exon span, cytoband, coordinate range, or c. dup/del HGVS."
          description: "Free-text CNV to parse: gene/exon span, cytoband, coordinate range, or c. dup/del HGVS."
          example: "BRCA2 exon 3-5 deletion"

        - name: "genePrefSourceId"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "GenePreferences"
            description: "Catalog id of the gene preferences catalog to consult when resolving a gene name to its preferred transcript. Defaults to the workspace's GenePreferences catalog."
          description: "Catalog id of the gene preferences catalog to consult when resolving a gene name to its preferred transcript. Defaults to the workspace's GenePreferences catalog."
          example: "GenePreferences"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnvQueryResponse"
                type: "object"
  /breakend:
    get:
      operationId: "breakendQuery"
      summary: "Parse a free-text breakend query into breakend variants."
      description: "Resolves a breakend or paired-breakend description into BreakendVariant records (locus, mate locus, retained side, inserted sequence) for the workspace build. Accepts coordinate pairs (e.g. '9:133751216, 22:23608316') and genomic HGVS inv/del/dup (e.g. '10:g.12210283_12255513inv'). For gene-fusion resolution with transcript effects, use parseRearrangement instead."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "9:133751216, 22:23608316"
            description: "Free-text breakend to parse: coordinate pair or genomic HGVS inv/del/dup."
          description: "Free-text breakend to parse: coordinate pair or genomic HGVS inv/del/dup."
          example: "9:133751216, 22:23608316"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakendQueryResponse"
                type: "object"
  /parse-rearrangement:
    get:
      operationId: "parseRearrangement"
      summary: "Resolve a fusion/rearrangement query into annotated candidates."
      description: "Parses a free-text gene-fusion or structural-rearrangement query into structured candidates with SV type, predicted transcript effect, breakend loci, and 5'/3' transcript annotations. Accepts gene-pair fusion syntax (e.g. 'BCR::ABL1'), breakpoint coordinates, c./g. HGVS, and exon-level fusion notation. The primary tool for resolving fusions; for simple paired breakends without transcript effects use breakendQuery."
      x-agent-expose: "promoted"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "query"
          required: true
          schema:
            type: "string"
            example: "BCR::ABL1"
            description: "Free-text query (e.g. BCR::ABL1, breakpoint coordinates, c./g. HGVS, exon-level fusion syntax)."
          description: "Free-text query (e.g. BCR::ABL1, breakpoint coordinates, c./g. HGVS, exon-level fusion syntax)."
          example: "BCR::ABL1"

        - name: "assembly"
          in: "query"
          required: true
          schema:
            type: "string"
            example: "GRCh_38,Chromosome,Homo sapiens"
            description: "Coord sys id for the workspace build, as the full three-part form; must match the configured lookup assembly exactly."
          description: "Coord sys id for the workspace build, as the full three-part form; must match the configured lookup assembly exactly."
          example: "GRCh_38,Chromosome,Homo sapiens"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseRearrangementResponse"
                type: "object"
  /default-transcript-for-gene:
    get:
      operationId: "defaultTranscriptForGene"
      summary: "Resolve the default RefSeq transcript for a gene, honoring the workspace gene preferences with canonical-transcript rules as the fallback."
      description: "Returns a single default RefSeq transcript for a gene. A PreferredTranscript from the workspace GenePreferences catalog wins when set for the gene; otherwise the canonical transcript is chosen (MANE Select, then LRG, completeness, and length). For the full transcript list use geneTranscripts. Identify the gene via geneId (preferred) or geneName."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "assembly"
          in: "query"
          required: true
          schema:
            type: "string"
            example: "GRCh_38,Chromosome,Homo sapiens"
            description: "Coord sys id for the workspace build, as the full three-part form; must match the configured lookup assembly exactly."
          description: "Coord sys id for the workspace build, as the full three-part form; must match the configured lookup assembly exactly."
          example: "GRCh_38,Chromosome,Homo sapiens"

        - name: "geneId"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "672"
            description: "RefSeq GeneID; takes precedence over geneName when both are set."
          description: "RefSeq GeneID; takes precedence over geneName when both are set."
          example: "672"

        - name: "geneName"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "BRCA1"
            description: "Gene symbol; used when geneId is omitted."
          description: "Gene symbol; used when geneId is omitted."
          example: "BRCA1"

        - name: "genePrefSourceId"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "GenePreferences"
            description: "Catalog id of the gene preferences catalog to consult. Defaults to the workspace's GenePreferences catalog."
          description: "Catalog id of the gene preferences catalog to consult. Defaults to the workspace's GenePreferences catalog."
          example: "GenePreferences"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultTranscriptForGeneResponse"
                type: "object"
  /gene-transcripts:
    get:
      operationId: "geneTranscripts"
      summary: "List all RefSeq transcripts for a gene with per-transcript ClinVar counts."
      description: "Lists every RefSeq transcript for a gene, each with its ClinVar assessment count, for the workspace build. Use to choose among transcripts; for just the default pick use defaultTranscriptForGene. Identify the gene via geneId (preferred) or geneName."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "assembly"
          in: "query"
          required: true
          schema:
            type: "string"
            example: "GRCh_38,Chromosome,Homo sapiens"
            description: "Coord sys id for the workspace build, as the full three-part form; must match the configured lookup assembly exactly."
          description: "Coord sys id for the workspace build, as the full three-part form; must match the configured lookup assembly exactly."
          example: "GRCh_38,Chromosome,Homo sapiens"

        - name: "geneId"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "672"
            description: "RefSeq GeneID; takes precedence over geneName when both are set."
          description: "RefSeq GeneID; takes precedence over geneName when both are set."
          example: "672"

        - name: "geneName"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "BRCA1"
            description: "Gene symbol; used when geneId is omitted."
          description: "Gene symbol; used when geneId is omitted."
          example: "BRCA1"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneTranscriptsResponse"
                type: "object"
  /region:
    get:
      operationId: "regionQuery"
      summary: "Parse a free-text region string into a genomic interval."
      description: "Resolves a region description into a single genomic interval (chr/start/stop) for the workspace build. Accepts forms like '1:12345-67890' and 'chrX-1000-2000'. Use to turn a user's region string into coordinates before a genomicQuery."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "1:12345-67890"
            description: "Free-text region to parse, e.g. '1:12345-67890' or 'chrX-1000-2000'."
          description: "Free-text region to parse, e.g. '1:12345-67890' or 'chrX-1000-2000'."
          example: "1:12345-67890"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionQueryResponse"
                type: "object"
  /genomic/query/{query}:
    post:
      operationId: "genomicQuery"
      summary: "Takes a genomic query \"chr-start-stop\" (0-based) or \"chr-pos\" (1-based) and returns annotations for that region."
      description: "Reads annotation records from a source that overlap a genomic region, with optional field selection, filter expression, and paging. This is a full record read that can return many rows; prefer regionQuery to resolve coordinates and resolveAnnotationSource to inspect fields first. Use tableLookup for indexed key lookups and readContinue to page a cursor."
      x-agent-expose: "progressive"
      x-agent-cost: "expensive"
      x-agent-permission: "file:read"
      parameters:
        - name: "query"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "source"
              properties:
                source:
                  $ref: "#/components/schemas/AnnotationSource"
                  type: "object"
                  description: "Source of the annotation."
                match:
                  $ref: "#/components/schemas/GenomicQueryMode"
                  type: "object"
                  description: "Coordinate-level match strategy."
                jaccardThreshold:
                  type: "number"
                  format: "double"
                  description: "Jaccard similarity cutoff when match == within/overlap on large CNVs."
                format:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/FormatOption"
                    type: "object"
                  description: "Response sections to return (reuses catalog 'format' options)."
                fieldIndexes:
                  type: "array"
                  items:
                    type: "number"
                    format: "int32"
                  description: "Fields to return by index. Default is all fields."
                fieldExpressions:
                  type: "array"
                  items:
                    type: "string"
                  example:
                    - "Chr"
                    - "Start"
                    - "Stop"
                    - "Chr ~ \":\" ~ (Start + 1) ~ \"-\" ~ Stop"
                    - "RefAlt"
                    - "Classification"
                    - "len(classification)"
                    - "slice(Classification, 0, 100)"
                  description: "Fields to return by symbol. Default is all fields."
                fieldNames:
                  type: "array"
                  items:
                    type: "string"
                  description: "Fields to return by field name. Default is all fields."
                filterTree:
                  $ref: "#/components/schemas/ExpressionNode"
                  type: "object"
                  description: "Optional filter expression, can be a tree of logical operators and predicates."
                limit:
                  type: "number"
                  format: "int32"
                  description: "Max records per page (1-10000)."
                offset:
                  type: "number"
                  format: "int32"
                  description: "Starting record position (for stateless paging)."
                enableCursor:
                  type: "boolean"
                  description: "If true, enables cursor-based pagination and generates a cursor in the response when hasMore is true."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
                type: "object"
  /table/lookup:
    post:
      operationId: "tableLookup"
      summary: "Look up records in a source by an indexed field value."
      description: "Returns records from a tabular or genomic source where an indexed field exactly matches a value (case-sensitive or -insensitive), with optional field selection, filter tree, and region filtering. Targeted key lookup; for a full scan use tableRead, for region overlap use genomicQuery. The lookupField must be indexed (check the fields from resolveAnnotationSource)."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "source"
                - "lookupField"
                - "lookupValue"
              properties:
                source:
                  $ref: "#/components/schemas/AnnotationSource"
                  type: "object"
                lookupField:
                  type: "string"
                  description: "The field to query on, indexed key required."
                lookupValue:
                  type: "string"
                  description: "The value to query on."
                lookupMode:
                  $ref: "#/components/schemas/TableLookupMode"
                  type: "object"
                format:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/FormatOption"
                    type: "object"
                  description: "Response sections to return (reuses catalog 'format' options)."
                fieldIndexes:
                  type: "array"
                  items:
                    type: "number"
                    format: "int32"
                  description: "Fields to return by index. Default is all fields."
                fieldSymbols:
                  type: "array"
                  items:
                    type: "string"
                  description: "Fields to return by symbol. Default is all fields."
                fieldNames:
                  type: "array"
                  items:
                    type: "string"
                  description: "Fields to return by field name. Default is all fields."
                filterTree:
                  $ref: "#/components/schemas/ExpressionNode"
                  type: "object"
                  description: "Optional filter expression, can be a tree of logical operators and predicates."
                filterRegions:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/GenomicSegment"
                    type: "object"
                  description: "Optional list of genomic regions. If provided, only records that overlap any of these regions are returned."
                limit:
                  type: "number"
                  format: "int32"
                  description: "Max records per page (1-10000)."
                offset:
                  type: "number"
                  format: "int32"
                  description: "Starting record position (for stateless paging)."
                enableCursor:
                  type: "boolean"
                  description: "If true, enables cursor-based pagination and generates a cursor in the response when hasMore is true."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
                type: "object"
  /table/read:
    post:
      operationId: "tableRead"
      summary: "Read records from a source table with optional filtering and paging."
      description: "Streams records from a source (typically a tabular/non-genomic source) with optional field selection, filter expression, and paging. This is a full-table read that can be large; prefer tableLookup for a keyed lookup or resolveAnnotationSource for just metadata. Use readContinue to fetch further pages via the returned cursor."
      x-agent-expose: "progressive"
      x-agent-cost: "expensive"
      x-agent-permission: "file:read"
      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "source"
              properties:
                source:
                  $ref: "#/components/schemas/AnnotationSource"
                  type: "object"
                format:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/FormatOption"
                    type: "object"
                  description: "Response sections to return (reuses catalog 'format' options)."
                fieldIndexes:
                  type: "array"
                  items:
                    type: "number"
                    format: "int32"
                  description: "Fields to return by index. Default is all fields."
                fieldExpressions:
                  type: "array"
                  items:
                    type: "string"
                  example:
                    - "Chr"
                    - "Start"
                    - "Stop"
                    - "Chr ~ \":\" ~ (Start + 1) ~ \"-\" ~ Stop"
                    - "RefAlt"
                    - "Classification"
                    - "len(Classification)"
                    - "slice(Classification, 0, 100)"
                  description: "Fields to return by symbol. Default is all fields."
                fieldNames:
                  type: "array"
                  items:
                    type: "string"
                  description: "Fields to return by field name. Default is all fields."
                filterTree:
                  $ref: "#/components/schemas/ExpressionNode"
                  type: "object"
                  description: "Optional filter expression, can be a tree of logical operators and predicates."
                limit:
                  type: "number"
                  format: "int32"
                  description: "Max records per page (1-10000)."
                offset:
                  type: "number"
                  format: "int32"
                  description: "Starting record position (for stateless paging)."
                enableCursor:
                  type: "boolean"
                  description: "If true, enables cursor-based pagination and generates a cursor in the response when hasMore is true. If false, cursor is only generated when a cursor parameter is provided."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
                type: "object"
  /continue/{cursor}:
    post:
      operationId: "readContinue"
      summary: "Continues a genomic query, tableRead, or tableLookup from a previous response."
      description: "Fetches the next page of a genomicQuery, tableRead, or tableLookup using the cursor returned when hasMore was true and cursoring was enabled. Continues an in-progress read."
      x-agent-expose: "progressive"
      x-agent-cost: "expensive"
      x-agent-permission: "file:read"
      parameters:
        - name: "cursor"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                format:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/FormatOption"
                    type: "object"
                  description: "Response sections to return (reuses catalog 'format' options)."
                limit:
                  type: "number"
                  format: "int32"
                  description: "Max records per page (1-1000)."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
                type: "object"
  /extract/diseases-and-phenotypes:
    get:
      operationId: "extractDiseasesAndPhenotypes"
      summary: "Extract disease/phenotype ontology terms from free text."
      description: "Scans clinical free text for disease and phenotype mentions and resolves them to ontology identifiers (HPO, MONDO), returning matched terms and their IDs. Also accepts explicit ontology IDs embedded in the text (e.g. 'MONDO:0011076 HP:0000717'). Requires the HPO/MONDO sources to be present; returns an error if they are unavailable."
      x-agent-expose: "progressive"
      x-agent-cost: "cheap"
      x-agent-permission: "file:read"
      parameters:
        - name: "text"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "persistent seizures and developmental delay"
            description: "The text to extract diseases and phenotypes from."
          description: "The text to extract diseases and phenotypes from."
          example: "persistent seizures and developmental delay"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDiseasesAndPhenotypesResponse"
                type: "object"
