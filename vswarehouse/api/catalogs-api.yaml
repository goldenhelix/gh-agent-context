            schema:
              type: "object"
              properties:
                recordId:
                  type: "string"
                  description: "Id of an existing record to update; omit to insert a new record."
                array:
                  type: "array"
                  items:
                    type: "object"
                  example: "['7', 140753335, 140753336, 'A/T', 'Pathogenic']"
                  description: "Alternative to object: the record's values as an ordered list in the catalog's schema field order (from catalogs:catalogSchema)."
                object:
                  type: "object"
                  example: "{'Chr': '7', 'Start': 140753335, 'Stop': 140753336, 'RefAlt': 'A/T', 'Classification': 'Pathogenic'}"
