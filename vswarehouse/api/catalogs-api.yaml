      summary: "Import records into a catalog from a delimited text (TSV/CSV) file"
      description: "Bulk-import records from a workspace TSV/CSV file into a catalog. Runs asynchronously and returns a processId to poll. Workflow: read the file's columns with preview:gaSourceMeta (their symbols) and the catalog's fields with catalogs:catalogInfo (their schema symbols), then supply fieldMapping to line them up. Mutates catalog data. For a variant catalog whose key is normalized ref/alt, first resolve any free-text variant column with lookup:variantQuery and stage a file with the normalized columns."
