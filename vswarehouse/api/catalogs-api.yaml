  /source/{catalogId}/aggregate:
    post:
      operationId: "catalogAggregate"
      summary: "Group records by one or more fields and compute counts server-side"
      description:
        - "Generalizes catalogIndexValues from single-field distinct-with-count to"
        - "multi-dimensional group-by. Array fields in groupBy are unwound by"
        - "default; multiple array fields in the same groupBy align by parallel"
        - "index. Text keys are compared case-insensitively; the first-seen"
        - "casing for each folded value is what appears in the response."
        - "Per-group `count` is always returned. Distinct value counts of"
        - "additional fields can be requested via countDistinct. The response"
        - "always returns the full group set for the filtered input in"
        - "unspecified order - no sort, no pagination knobs, no top-N cap."
        - "Callers sort and slice client-side. Server-side maxGroups is the only"
        - "backpressure mechanism; callers that hit it should tighten filterTree"
        - "/ genomicQuery."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "groupBy"
              properties:
                genomicQuery:
                  $ref: "#/components/schemas/GenomicQuery"
                  type: "object"
                filterTree:
                  $ref: "#/components/schemas/ExpressionNode"
                  type: "object"
                queryMode:
                  $ref: "#/components/schemas/CatalogQueryMode"
                  type: "object"
                groupBy:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/AggregateGroupSpec"
                    type: "object"
                countDistinct:
                  type: "array"
                  items:
                    type: "string"
                  description:
                    - "Optional list of field symbols. For each entry, every AggregateGroup"
                    - "row gains a column keyed `distinct.<fieldSymbol>` whose value is the"
                    - "per-group distinct value count. Array fields are unwound and"
                    - "parallel-index aligned with any unwound groupBy fields."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateResponse"
                type: "object"
