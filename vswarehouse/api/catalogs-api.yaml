openapi: '3.0.2'
info:
  title: Catalog API
  version: '1.0.0'
  description: 'Provides endpoints for managing workspace catalogs, including user access, schema definitions, record state, versioning, approvals, publishing, archiving, and data operations.'

externalDocs:
  url: '/docs/api-docs'
  description: API Documentation

servers:
  - url: '/w/my_workspace/api/catalogs'




paths:
  /template/:
    get:
      operationId: "catalogTemplate"
      summary: "Get a system catalog schema template as text"
      description: "Return one built-in catalog schema template (its field definitions) as a YAML or JSON string. Use it to inspect a template before creating a catalog from it with catalogCreateFromSystemTemplate. The id is a template id from catalogSystemTemplateList."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "id"
          in: "query"
          required: true
          schema:
            type: "string"
            example: "GeneLists"
            description: "Template id as returned by catalogSystemTemplateList."
          description: "Template id as returned by catalogSystemTemplateList."
          example: "GeneLists"

        - name: "format"
          in: "query"
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSchemaFormat"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /systemTemplateList/:
    get:
      operationId: "catalogSystemTemplateList"
      summary: "List available built-in catalog schema templates"
      description: "List the built-in catalog schema templates (id, name, group) a new catalog can be created from. Pair with catalogTemplate to view a template's fields and catalogCreateFromSystemTemplate to instantiate one."
      x-agent-permission: "catalog:read"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CatalogTemplate"
                  type: "object"
  /about/:
    get:
      operationId: "catalogApiAbout"
      summary: "Get catalog API version and capabilities"
      description: "Return the catalog API version and feature flags (e.g. whether approval workflows are supported). A cheap capability probe."
      x-agent-permission: "catalog:read"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApiInfo"
                type: "object"
  /source/{catalogId}/requiredApprovalCount:
    get:
      operationId: "catalogApprovalCount"
      summary: "Get how many approvals a record needs before publishing"
      description: "Return how many approvals a record in this catalog requires before it can be published (0 means approvals are not required). Read-only; the setter is a separate manage-only operation."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "number"
                format: "int32"
    put:
      operationId: "setCatalogApprovalCount"
      summary: "Set how many approvals are required before publishing a record"
      description: "Administrative setting that changes the catalog's approval policy. Mutates catalog configuration."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "count"
              properties:
                count:
                  type: "number"
                  format: "int32"
                  example: 2
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "number"
                format: "int32"
  /source/{catalogId}/users:
    get:
      operationId: "catalogUsersList"
      summary: "List users recorded in the catalog"
      description: "Return the user identities recorded in this catalog (record authors and assignees) as id/name pairs. Read-only."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CatalogUser"
                  type: "object"
  /source/{catalogId}/remapUser/{userId}:
    put:
      operationId: "catalogRemapUser"
      summary: "Reassign one catalog user's records to a different user"
      description: "Administrative fixup that rewrites the author/assignee identity on records from one user to another (e.g. after an account change). Mutates records."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "newUser"
              properties:
                newUser:
                  $ref: "#/components/schemas/CatalogUser"
                  type: "object"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogUser"
                type: "object"
  /source/{catalogId}:
    delete:
      operationId: "catalogDelete"
      summary: "Permanently delete an entire catalog"
      description: "Destructive. Removes the catalog and all of its records from the workspace. Not reversible."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
    get:
      operationId: "catalogQuery"
      summary: "Query catalog records with filters, sorting, and paging"
      description: "Read records from a catalog, optionally filtered by a genomicQuery and/or a filterTree expression, sorted, paged, and projected to chosen fields. This returns actual row data, so it is the expensive path. To answer how many records match, use catalogInfo (recordCount) or catalogAggregate, and to list a field's values use catalogIndexValues. Restrict fieldsBySymbol and limit to keep responses small; page with offset, or with enableCursor plus catalogReadContinue."
      x-agent-expose: "promoted"
      x-agent-cost: "expensive"
      x-agent-permission: "catalog:read"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

        - name: "genomicQuery"
          in: "query"
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenomicQuery"

        - name: "filterTree"
          in: "query"
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressionNode"
          description: "Optional filter, as an ExpressionNode object. A predicate is {op, field, value} where op is a word from OperatorType (Equals, NotEquals, Substring, StartsWith, EndsWith, LessThan, GreaterThan, IsNull, \u2026 \u2014 never a symbol like ==) and field is a field symbol from catalogSchema; combine predicates with {op: And|Or|Not, children: [ \u2026 ]}. Example: {\"op\": \"Equals\", \"field\": \"Sample\", \"value\": \"Imported Variants\"}."

        - name: "orderby"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/FieldSort"
              type: "object"

        - name: "limit"
          in: "query"
          required: true
          schema:
            type: "number"
            format: "int32"
            example: 50
          example: 50

        - name: "offset"
          in: "query"
          required: false
          schema:
            type: "number"
            format: "int32"

        - name: "fields"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "number"
              format: "int32"
            description: "Field indices (fId from catalogSchema) to return; usually prefer fieldsBySymbol."
          description: "Field indices (fId from catalogSchema) to return; usually prefer fieldsBySymbol."

        - name: "fieldsBySymbol"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
            example: "['Chr', 'Start', 'Stop', 'RefAlt', 'Classification']"
            description: "Which fields to return, as exact field symbols from catalogSchema (the 'symbol' values, e.g. 'Chr', 'RefAlt' \u2014 read catalogSchema first, do not guess). Omit to return all fields."
          description: "Which fields to return, as exact field symbols from catalogSchema (the 'symbol' values, e.g. 'Chr', 'RefAlt' \u2014 read catalogSchema first, do not guess). Omit to return all fields."

        - name: "format"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/FormatOption"
              type: "object"
            description: "What the response's data object contains \u2014 request the shapes you want (default is only counts, empty data). Include 'objects' to get the records as data.objects (one object per record keyed by field symbol); or 'values' + 'fieldNames' for row arrays; 'recordIds' for the ids. To read rows, you almost always want ['objects']."
          description: "What the response's data object contains \u2014 request the shapes you want (default is only counts, empty data). Include 'objects' to get the records as data.objects (one object per record keyed by field symbol); or 'values' + 'fieldNames' for row arrays; 'recordIds' for the ids. To read rows, you almost always want ['objects']."

        - name: "queryMode"
          in: "query"
          required: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogQueryMode"

        - name: "enableCursor"
          in: "query"
          required: false
          schema:
            type: "boolean"
            description: "If true, enables cursor-based pagination and generates a cursor in the response when hasMore is true."
          description: "If true, enables cursor-based pagination and generates a cursor in the response when hasMore is true."

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
                type: "object"
    post:
      operationId: "catalogWriteRecords"
      summary: "Write (bulk) many records to a catalog"
      description: "Bulk-insert or update many records in one call. Requires publish permission and mutates catalog data; for a single record use catalogWriteRecord."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:publish"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                errorMode:
                  $ref: "#/components/schemas/ErrorMode"
                  type: "object"
                values:
                  type: "array"
                  items:
                    type: "array"
                    items:
                      type: "object"
                objects:
                  type: "array"
                  items:
                    type: "object"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/WriteRecordResult"
                  type: "object"
  /source/{catalogId}/catalogDuplicate:
    post:
      operationId: "catalogDuplicate"
      summary: "Create a duplicate copy of a catalog"
      description: "Create a new catalog that copies this catalog's schema and records under a new id. Administrative operation that creates a new catalog."
      x-agent-expose: "progressive"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "newId"
                - "newName"
              properties:
                newId:
                  type: "string"
                  example: "GeneLists_GRCh_38_copy"
                newName:
                  type: "string"
                  example: "Gene Lists (copy)"
                newNote:
                  type: "string"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /source/{catalogId}/backup:
    post:
      operationId: "catalogBackup"
      summary: "Back up a catalog to a file in the workspace"
      description:
        - "Produces a consistent, self-contained .catalog snapshot even"
        - "while the source catalog has concurrent readers and writers."
        - "Returns a process ID that can be polled on"
        - "/api/catalogs/ps/{processId} for progress."
      x-agent-expose: "progressive"
      x-agent-permission: "catalog:manage"
      x-agent-returns-process: true
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "destinationPath"
              properties:
                destinationPath:
                  type: "string"
                  example: "Documents/PGx-2026-04-15.catalog"
                  description: "Workspace-relative path for the backup file (e.g. Documents/PGx-2026-04-15.catalog)"
                overwrite:
                  type: "boolean"
                  description: "Allow overwriting an existing destination file"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /source/{catalogId}/restore:
    post:
      operationId: "catalogRestore"
      summary: "Replace a catalog's contents with a backup file from the workspace"
      description:
        - "Closes the live catalog, swaps its file with the provided source,"
        - "and reopens it. The source file must be a valid catalog (typically"
        - "the output of catalogBackup). Other API requests targeting this"
        - "catalog during the brief replace window return \"catalog not found\"."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "sourcePath"
              properties:
                sourcePath:
                  type: "string"
                  example: "Documents/PGx-2026-04-15.catalog"
                  description: "Workspace-relative path to the source .catalog file"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /source/{catalogId}/createFromTemplate:
    post:
      operationId: "catalogCreateFromTemplate"
      summary: "Create a new catalog from an uploaded template file"
      description: "Create a new catalog at the given id from an uploaded schema template file. Administrative operation that creates a new catalog."
      x-agent-expose: "progressive"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/octet-stream: {}
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogInfo"
                type: "object"
  /source/{catalogId}/createFromSystemTemplate:
    post:
      operationId: "catalogCreateFromSystemTemplate"
      summary: "Create a new catalog from a built-in system template"
      description: "Create a new catalog at the given id from a built-in template (see catalogSystemTemplateList for available templateIds). Administrative operation that creates a new catalog."
      x-agent-expose: "progressive"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "templateId"
              properties:
                templateId:
                  type: "string"
                  example: "GeneLists"
                name:
                  type: "string"
                description:
                  type: "string"
                group:
                  type: "string"
                assembly:
                  type: "string"
                  example: "GRCh_38,Chromosome,Homo sapiens"
                approvalCount:
                  type: "number"
                  format: "int32"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogInfo"
                type: "object"
  /source/{catalogId}/createFromShippedFile:
    post:
      operationId: "catalogCreateFromShippedFile"
      summary: "Create a new catalog by copying a shipped .catalog file"
      description:
        - "Locates a shipped catalog file (e.g. GenePreferences.catalog) in the"
        - "apiserver's Data directory, copies it into the workspace's catalogs"
        - "path under the given catalogId, and registers it with the catalog"
        - "service in-process so it is immediately usable. Returns 409 if a"
        - "catalog with that id already exists in the workspace."
      x-agent-expose: "progressive"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "sourceFile"
              properties:
                sourceFile:
                  type: "string"
                  example: "GenePreferences.catalog"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogInfo"
                type: "object"
  /source/{catalogId}/catalogCreate:
    post:
      operationId: "catalogCreate"
      summary: "Create a new catalog with a custom schema"
      description: "Create a new catalog. The catalogId path param is the catalog's file identifier \u2014 derive it from the name by removing spaces and special characters into a filename-friendly identifier (e.g. name 'ACMG Variants' -> catalogId 'ACMG_Variants'); do not invent unrelated ids or casing. Catalogs have a feature type that fixes their required KEY fields, so pick the right type \u2014 the simplest and most reliable way is to set addFeatureFields to the type and let the server add the correct key fields: Variant (adds a 'Ref/Alt' string key alongside Chr/Start/Stop), CNV (adds a 'Type' enum key: Gain/Loss/Normal/CN LoH), Breakend (adds 'Retained' and 'Insertion' keys and uses Mate keying), Sample (adds a 'Sample' string key, no genomic fields), or Region (just Chr/Start/Stop). addFeatureFields also sets addGenomicFields and primaryKeyMode for you, so leave those unset when you use it (an assembly is still required for the genomic types). If you instead define the schema by hand, you MUST include the type's key fields yourself \u2014 e.g. a Variant catalog must have a field named 'Ref/Alt' of dataType s, or it will just be a plain region catalog. 'fields' is only for your own extra (non-key) columns. After creating, import rows with catalogImportSource / catalogImportDelimitedText. Administrative; use catalogCreateFromSystemTemplate to start from a built-in schema instead."
      x-agent-expose: "progressive"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "fields"
              properties:
                name:
                  type: "string"
                description:
                  type: "string"
                group:
                  type: "string"
                primaryKeyMode:
                  $ref: "#/components/schemas/CatalogKeyMode"
                  type: "object"
                  description: "How records are keyed. Unit = a single key per record \u2014 the standard choice for variant/region/CNV catalogs; use it unless you specifically need Mate (two key sets, e.g. breakends) or List (multiple key sets per record). A non-Unit genomic catalog requires named chr/start/stop columns in imported sources, so keep Unit to import coordinate-only sources like BED/VCF. Ignored when addFeatureFields is set (the type chooses the mode)."
                addGenomicFields:
                  type: "boolean"
                  description: "Prepend the genomic key fields (Chr, Start, Stop) so the catalog supports genomic queries and coordinate-based imports. Set true for any variant/region/CNV catalog. Ignored when addFeatureFields is set (the type decides)."
                addFeatureFields:
                  $ref: "#/components/schemas/CatalogRecordType"
                  type: "object"
                  description: "Optional: add the standard KEY fields for a catalog feature type, the way addGenomicFields adds Chr/Start/Stop. Variant \u2192 adds 'Ref/Alt' (s) as a primary key with Chr/Start/Stop. CNV \u2192 adds 'Type' (enum: Gain/Loss/Normal/CN LoH) as a primary key with Chr/Start/Stop. Breakend \u2192 adds 'Retained' and 'Insertion' primary keys with Chr/Start/Stop and sets Mate keying. Sample \u2192 adds a 'Sample' (s) primary key, no genomic fields. Region \u2192 just Chr/Start/Stop. When set, it also sets addGenomicFields and primaryKeyMode, and you should list only your own non-key columns in 'fields'. Prefer this over hand-building the key fields."
                assembly:
                  type: "string"
                  example: "GRCh_38,Chromosome,Homo sapiens"
                fields:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/CatalogField"
                    type: "object"
                  description: "Your own extra (non-key) fields, each a CatalogField: at minimum name (display) and dataType (TSF short form: s=string, i=int, f=float, b=bool, e=enum), plus required (bool) and choices for enum fields. Do NOT set symbol \u2014 it is auto-generated from name (read it back from the created schema). Do NOT list key fields here that come from addGenomicFields (Chr/Start/Stop) or addFeatureFields (e.g. Ref/Alt, Type, Retained, Insertion, Sample)."
                approvalCount:
                  type: "number"
                  format: "int32"
                version:
                  type: "string"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogInfo"
                type: "object"
  /reload/:
    post:
      operationId: "catalogsReload"
      summary: "Reload all catalogs from the server catalogs directory"
      description: "Administrative operation that re-scans the workspace catalogs directory and refreshes the in-memory catalog registry."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:manage"
      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              properties: {}
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /filter/:
    put:
      operationId: "catalogsFilter"
      summary: "Find catalogs matching schema criteria"
      description: "Return the catalogs whose schema matches the given criteria (assembly, required fields/indexes, key mode, record type, approver count). A discovery read for locating a catalog by shape; for the full list use catalogsList."
      x-agent-permission: "catalog:read"
      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                assembly:
                  type: "string"
                  example: "GRCh_38,Chromosome,Homo sapiens"
                fields:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/CatalogField"
                    type: "object"
                indexOnSymbol:
                  type: "array"
                  items:
                    type: "string"
                  example: "['classification']"
                primaryKeyMode:
                  $ref: "#/components/schemas/CatalogKeyMode"
                  type: "object"
                recordType:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/CatalogRecordType"
                    type: "object"
                requiredApprovers:
                  type: "number"
                  format: "int32"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CatalogInfo"
                  type: "object"
  /namedDefault/{name}:
    get:
      operationId: "defaultNamedCatalog"
      summary: "Resolve the default catalog for a named gene source (GenePreferences or GeneLists)"
      description: "Of the catalogs matching the named source's schema for the given build, return the one whose id is the per-build default, otherwise the first schema match. Returns the chosen CatalogInfo, or an error if none is present. {name} is the source name, e.g. GenePreferences or GeneLists."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "name"
          in: "path"
          required: true
          schema:
            type: "string"

        - name: "assembly"
          in: "query"
          required: false
          schema:
            type: "string"
            example: "GRCh_38,Chromosome,Homo sapiens"
            description: "Coordinate system / build (e.g. 'GRCh_38,Chromosome,Homo sapiens'). Defaults to the server's configured assembly."
          description: "Coordinate system / build (e.g. 'GRCh_38,Chromosome,Homo sapiens'). Defaults to the server's configured assembly."
          example: "GRCh_38,Chromosome,Homo sapiens"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogInfo"
                type: "object"
  /source/:
    get:
      operationId: "catalogsList"
      summary: "List all available catalogs"
      description: "List every catalog in the workspace with its metadata (id, name, group, assembly, record type, record count). The starting point for catalog work. Pick a catalogId here, then use catalogInfo, catalogSchema, or catalogQuery. Cheap. By default only summary fields are returned; request the schema field via responseFields (or call catalogSchema) if you need field definitions."
      x-agent-expose: "promoted"
