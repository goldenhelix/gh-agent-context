                sourceUserId:
                  type: "string"
                  description: "User ID to write authority records with (e.g. \"CPICandFDA\")"
                baselineUserIds:
                  type: "array"
                  items:
                    type: "string"
                  description: "All source user IDs to treat as authority in history detection"
                additiveOnly:
                  type: "boolean"
                  description: "If true, only add/update records, skip proposed deletions"
                fieldMapping:
                  type: "object"
                previewOnly:
                  type: "boolean"
                  description: "If true, run analysis and return counts without modifying any records"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
  /source/{catalogId}/events:
    get:
      operationId: "catalogEvents"
      summary: "Get the audit event log for a catalog"
      description: "Return the catalog's audit log of bulk and administrative actions (who did what, when, with counts and details). Cheap paged read."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

        - name: "limit"
          in: "query"
          required: true
          schema:
            type: "number"
            format: "int32"

        - name: "offset"
          in: "query"
          required: false
          schema:
            type: "number"
            format: "int32"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CatalogEvent"
                  type: "object"
  /source/{catalogId}/sourceVersion:
    get:
      operationId: "catalogSourceVersion"
      summary: "Get the catalog's authority source version string"
      description: "Return the catalog's recorded authority source version (e.g. the source user and version it was last rebased against). Cheap."
      x-agent-permission: "catalog:read"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
    put:
      operationId: "catalogSetSourceVersion"
      summary: "Set the catalog's authority source version string"
      description: "Administrative operation that overwrites the recorded authority source version. Mutates catalog configuration."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:manage"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "version"
              properties:
                version:
                  type: "string"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
components:
  schemas:
    CatalogApiInfo:
      type: "object"
      properties:
        version:
          type: "string"
          example: "1.0.0"
        supportsApproval:
          type: "boolean"
          example: true
      required:
        - "version"
        - "supportsApproval"

    CatalogQueryMode:
      type: "string"
      enum:
        - "LatestPublishedRecord"
        - "LatestActiveRecord"
        - "RecordActivity"

    CatalogBulkActionType:
      type: "string"
      enum:
        - "DraftArchive"
        - "ConfirmDeletion"
        - "DiscardPending"
        - "NewDraft"
        - "Approve"
        - "Publish"
        - "Assign"

    CatalogRecordType:
      type: "string"
      enum:
        - "Variant"
        - "CNV"
        - "Breakend"
        - "Region"
        - "Sample"
        - "Tabular"

    CatalogFieldValidatorType:
      type: "string"
      enum:
        - "Date"
        - "Url"
        - "Email"

    WriteRecordResult:
      type: "object"
      properties:
        recordId:
          type: "string"
          example: "record-1234"
        errorRecord:
          type: "object"
        errorMessage:
          type: "string"

    CatalogFieldMeta:
      type: "object"
      properties:
        isHtmlContent:
          type: "boolean"
        isJsonContent:
          type: "boolean"
        isPrimaryKey:
          type: "boolean"
        isIndexed:
          type: "boolean"
        urlTemplate:
          type: "string"
        control:
          type: "string"
        placeholder:
          type: "string"
        lineHeight:
          type: "number"
          format: "int32"
        min:
          type: "number"
          format: "int32"
        max:
          type: "number"
          format: "int32"
        precision:
          type: "number"
          format: "int32"
        step:
          type: "number"
          format: "int32"
        minLength:
          type: "number"
          format: "int32"
        maxLength:
          type: "number"
          format: "int32"
        activeText:
          type: "string"
        inactiveText:
          type: "string"
        displayUnit:
          type: "string"
        validator:
          $ref: "#/components/schemas/CatalogFieldValidatorType"
          type: "object"
        pattern:
          type: "string"
        defaultValue:
          type: "object"
        defaultMode:
          type: "string"
        hidden:
          type: "boolean"
        editable:
          type: "boolean"
        labels:
          type: "array"
          items:
            type: "string"
        isMetaField:
          type: "boolean"

    CatalogFieldEnum:
      type: "object"
      properties:
        name:
          type: "string"
        value:
          type: "number"
          format: "int32"
        doc:
          type: "string"
        meta:
          type: "object"
      required:
        - "name"
        - "value"

    CatalogField:
      type: "object"
      properties:
        fId:
          type: "number"
          format: "int32"
          example: 0
        name:
          type: "string"
          description: "The field's display name (what users see). The symbol is derived from this, so this is the only name you set."
          example: "Ref/Alt"
        symbol:
          type: "string"
          description: "The code identifier used as the record object key. Do NOT set this when creating fields \u2014 the server derives it from name (spaces/punctuation removed to a valid identifier). It is returned so you can see the generated symbol; only supply it to reference an existing field."
          example: "refAlt"
        dataType:
          type: "string"
          example: "s"
        required:
          type: "boolean"
        doc:
          type: "string"
          example: "The reference and alt allele"
        meta:
          $ref: "#/components/schemas/CatalogFieldMeta"
          type: "object"
        choices:
          type: "array"
          items:
            $ref: "#/components/schemas/CatalogFieldEnum"
            type: "object"
      required:
        - "name"
        - "symbol"
        - "dataType"
        - "required"

    CatalogKeyMode:
      type: "string"
      enum:
        - "Unit"
        - "Mate"
        - "List"

    CatalogSchemaFormat:
      type: "string"
      enum:
        - "YAML"
        - "JSON"

    CatalogTemplate:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        group:
          type: "string"
      required:
        - "id"
        - "name"
        - "group"

    CatalogSchema:
      type: "object"
      properties:
        version:
          type: "number"
          format: "int32"
          example: 0
        note:
          type: "string"
        created:
          type: "string"
          example: "2019-06-24T00:00:00.000Z"
        createdBy:
          type: "string"
          example: "Example User <user@example.com>"
        primaryKeyMode:
          $ref: "#/components/schemas/CatalogKeyMode"
          type: "object"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/CatalogField"
            type: "object"
      required:
        - "version"
        - "note"
        - "created"
        - "createdBy"
        - "primaryKeyMode"
        - "fields"

    CatalogUser:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
          example: "Example User"
      required:
        - "id"
        - "name"

    ServerCatalogOptions:
      type: "object"
      properties:
        saveDebouncePeriod:
          type: "number"
          format: "int32"
        restrictedToAssigned:
          type: "boolean"
        unrestrictedGroups:
          type: "array"
          items:
            type: "string"
        restrictedToAssignedGroups:
          type: "array"
          items:
            type: "string"
        catalogReadGroups:
          type: "array"
          items:
            type: "string"
        catalogWriteGroups:
          type: "array"
          items:
            type: "string"
        catalogApproveGroups:
          type: "array"
          items:
            type: "string"
        catalogPublishGroups:
          type: "array"
          items:
            type: "string"
      required:
        - "restrictedToAssigned"
        - "unrestrictedGroups"
        - "restrictedToAssignedGroups"
        - "catalogReadGroups"
        - "catalogWriteGroups"
        - "catalogApproveGroups"
        - "catalogPublishGroups"

    CatalogInfo:
      type: "object"
      properties:
        id:
          type: "string"
          example: "acmgvariants"
        supportsApproval:
          type: "boolean"
          example: true
        supportsGenomicQueries:
          type: "boolean"
        annotationUrl:
          type: "string"
        exists:
          type: "boolean"
        size:
          type: "number"
          format: "int32"
          example: 1234
        name:
          type: "string"
          example: "Variant Catalog"
        uuid:
          type: "string"
          example: "00000000-0000-0000-0000-000000000000"
        description:
          type: "string"
          example: "Catalog description"
        group:
          type: "string"
          example: "VSClinical"
        assembly:
          type: "string"
          example: "GRCh38,Chromosome,Homo sapiens"
        recordType:
          $ref: "#/components/schemas/CatalogRecordType"
          type: "object"
        recordCount:
          type: "number"
          format: "int32"
          example: 1234
        lastUpdate:
          type: "string"
          example: "2019-06-24T00:00:00.000Z"
        created:
          type: "string"
          example: "2019-06-24T00:00:00.000Z"
        schema:
          $ref: "#/components/schemas/CatalogSchema"
          type: "object"
        errorMessage:
          type: "string"
        writePermission:
          type: "boolean"
        managePermission:
          type: "boolean"
        approvePermission:
          type: "boolean"
        publishPermission:
          type: "boolean"
      required:
        - "id"
        - "supportsApproval"
        - "supportsGenomicQueries"
        - "annotationUrl"
        - "exists"
        - "size"
        - "name"
        - "uuid"
        - "description"
        - "group"
        - "recordType"
        - "lastUpdate"
        - "created"
        - "writePermission"
        - "managePermission"
        - "approvePermission"
        - "publishPermission"

    ErrorMode:
      type: "string"
      enum:
        - "Strict"
        - "SkipInvalidFields"
        - "SkipBadRecords"
        - "FillDefaultValues"

    OutputFileType:
      type: "string"
      enum:
        - "TSF"
        - "TXT"
        - "VCF"
        - "XLSX"

    FormatOption:
      type: "string"
      enum:
        - "values"
        - "objects"
        - "fieldNames"
        - "fieldMetas"
        - "recordIds"
        - "recordErrors"
        - "serializedQuery"

    ResponseData:
      type: "object"
      properties:
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/CatalogField"
            type: "object"
        fieldNames:
          type: "array"
          items:
            type: "string"
        recordCount:
          type: "number"
          format: "int32"
        recordIds:
          type: "array"
          items:
            type: "string"
        serializedQuery:
          type: "string"
        values:
          type: "array"
          items:
            type: "array"
            items:
              type: "object"
        objects:
          type: "array"
          items:
            type: "object"
        recordErrors:
          type: "array"
          items:
            type: "object"
        recordAssignment:
          type: "string"

    QueryResponse:
      type: "object"
      properties:
        limit:
          type: "number"
          format: "int32"
        offset:
          type: "number"
          format: "int32"
        count:
          type: "number"
          format: "int32"
        hasMore:
          type: "boolean"
        took:
          type: "number"
          format: "int32"
        cursor:
          type: "string"
          description: "Opaque resume token for stateful paging"
        data:
          $ref: "#/components/schemas/ResponseData"
          type: "object"
      required:
        - "offset"
        - "count"
        - "hasMore"
        - "took"
        - "data"

    FieldIndexQueryResponse:
      type: "object"
      properties:
        limit:
          type: "number"
          format: "int32"
        offset:
          type: "number"
          format: "int32"
        count:
          type: "number"
          format: "int32"
        hasMore:
          type: "boolean"
        took:
          type: "number"
          format: "int32"
        values:
          type: "array"
          items:
            type: "object"
      required:
        - "offset"
        - "count"
        - "hasMore"
        - "took"
        - "values"

    CatalogRecordCountsByBaselineUserResponse:
      type: "object"
      properties:
        customRecordCount:
          type: "number"
          format: "int32"
          description: "Count of records whose original author is not the baseline user."
        modifiedRecordCount:
          type: "number"
          format: "int32"
          description: "Count of records whose original author is the baseline user but current author is not."
        archivedRecordCount:
          type: "number"
          format: "int32"
          description: "Count of records that are archived and whose original author is the baseline user."
        error:
          type: "string"
          description: "Error message when the request failed."
      required:
        - "customRecordCount"
        - "modifiedRecordCount"
        - "archivedRecordCount"

    CatalogRebaseSourceResponse:
      type: "object"
      properties:
        updatedCount:
          type: "number"
          format: "int32"
          description: "Records overwritten from authority source (untouched by user)"
        mergedCount:
          type: "number"
          format: "int32"
          description: "Records auto-merged with no field conflicts"
        conflictCount:
          type: "number"
          format: "int32"
          description: "Records with field-level conflicts (draft created for review)"
        deletedCount:
          type: "number"
          format: "int32"
          description: "Records proposed for deletion (DraftArchive created)"
        addedCount:
          type: "number"
          format: "int32"
          description: "New records added from authority source"
        error:
          type: "string"
      required:
        - "updatedCount"
        - "mergedCount"
        - "conflictCount"
        - "deletedCount"
        - "addedCount"

    CatalogEvent:
      type: "object"
      properties:
        id:
          type: "number"
          format: "int32"
        timestamp:
          type: "string"
          description: "ISO 8601 timestamp"
        userId:
          type: "string"
        userName:
          type: "string"
        actionName:
          type: "string"
          description: "Human-readable action description"
        actionData:
          type: "object"
          description: "JSON details (source URL, counts, duration, etc.)"
      required:
        - "id"
        - "timestamp"
        - "userId"
        - "userName"
        - "actionName"

    RecordPublishedState:
      type: "string"
      enum:
        - "Public"
        - "InProgress"

    CatalogRecord:
      type: "object"
      properties:
        id:
          type: "string"
        status:
          $ref: "#/components/schemas/RecordPublishedState"
          type: "object"
        historyId:
          type: "string"
        historyCount:
          type: "number"
          format: "int32"
        approvedBy:
          type: "array"
          items:
            type: "string"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/CatalogField"
            type: "object"
        fieldNames:
          type: "array"
          items:
            type: "string"
        values:
          type: "array"
          items:
            type: "object"
        errors:
          type: "object"
        object:
          type: "object"
      required:
        - "status"
        - "historyId"
        - "historyCount"
        - "approvedBy"

    CatalogRecordState:
      type: "object"
      properties:
        draftRecord:
          $ref: "#/components/schemas/CatalogRecord"
          type: "object"
        publishedRecord:
          $ref: "#/components/schemas/CatalogRecord"
          type: "object"

    DraftState:
      type: "string"
      enum:
        - "Added"
        - "Changed"
        - "Deleted"

    DraftSummaryTotals:
      type: "object"
      properties:
        added:
          type: "number"
          format: "int32"
          description: "Count of drafts whose record id has no published baseline"
        changed:
          type: "number"
          format: "int32"
          description: "Count of edit drafts whose record id has a published baseline"
        deleted:
          type: "number"
          format: "int32"
          description: "Count of draft deletes whose record id has a published baseline to remove"
        total:
          type: "number"
          format: "int32"
          description: "added + changed + deleted"
        draft:
          type: "number"
          format: "int32"
          description: "Count of pending records whose latest version is a Draft (status-based, orthogonal to added/changed)"
        approved:
          type: "number"
          format: "int32"
          description: "Count of pending records whose latest version is Approved"
        draftArchive:
          type: "number"
          format: "int32"
          description: "Count of pending records whose latest version is a DraftArchive (pending deletion)"
      required:
        - "added"
        - "changed"
        - "deleted"
        - "total"
        - "draft"
        - "approved"
        - "draftArchive"

    DraftRecord:
      type: "object"
      properties:
        recordId:
          type: "string"
        draftHistoryId:
          type: "string"
          description:
            - "History id of the latest active draft for this record. Required by"
            - "catalogRecordPublish / catalogDraftDelete, so including it here lets"
            - "Review's bulk-publish flow skip the per-row catalogRecordState round-trip."
        state:
          $ref: "#/components/schemas/DraftState"
          type: "object"
          description:
            - "Server-computed classification (Added / Changed / Deleted) relative to"
            - "the published baseline. Distinct from draft.status, which surfaces the"
            - "physical record status (InProgress / Public) from the underlying iterator."
        draft:
          $ref: "#/components/schemas/CatalogRecord"
          type: "object"
          description:
            - "Projection of the draft record, shape controlled by format and field"
            - "params. For a Deleted state this is the draft delete body."
      required:
        - "recordId"
        - "draftHistoryId"
        - "state"
        - "draft"

    DraftSummaryResponse:
      type: "object"
      properties:
        took:
          type: "number"
          format: "int32"
        totals:
          $ref: "#/components/schemas/DraftSummaryTotals"
          type: "object"
          description:
            - "Totals reflect the full filtered draft set, not just this page, and are"
            - "not affected by the states filter."
        records:
          type: "array"
          items:
            $ref: "#/components/schemas/DraftRecord"
            type: "object"
          description: "Populated when totalsOnly is false"
        limit:
          type: "number"
          format: "int32"
        offset:
          type: "number"
          format: "int32"
        count:
          type: "number"
          format: "int32"
          description: "Number of records returned in this page"
        hasMore:
          type: "boolean"
        cursor:
          type: "string"
      required:
        - "took"
        - "totals"

    AggregateGroupSpec:
      type: "object"
      properties:
        field:
          type: "string"
          description:
            - "Field symbol from the catalog schema. Array fields are unwound by"
            - "default (one contribution per element). When multiple array fields"
            - "appear in the same groupBy they iterate by parallel index."
        name:
          type: "string"
          description: "Column name in each AggregateGroup row; defaults to the field symbol"
      required:
        - "field"

    AggregateResponse:
      type: "object"
      properties:
        count:
          type: "number"
          format: "int32"
          description: "Number of groups returned (equal to groups.length)"
        took:
          type: "number"
          format: "int32"
        groups:
          type: "array"
          items:
            type: "object"
          description:
            - "Each group is a flat map of column-name to value. The groupBy outputs"
            - "are keyed by their `name` (defaults to the field symbol). The implicit"
            - "per-group record count is keyed `count`. Per-field distinct counts are"
            - "keyed `distinct.<fieldSymbol>` (only present when the request supplied"
            - "a non-empty countDistinct list). Values are string, int, or null. The"
            - "reserved keys `count` and any key starting with `distinct.` cannot be"
            - "used as a groupBy name."
      required:
        - "count"
        - "took"
        - "groups"

    BulkActionError:
      type: "object"
      properties:
        recordId:
          type: "string"
        message:
          type: "string"
      required:
        - "recordId"
        - "message"

    BulkActionResult:
      type: "object"
      properties:
        requested:
          type: "number"
          format: "int32"
          description: "Records in an applicable status that the action was attempted on"
        succeeded:
          type: "number"
          format: "int32"
        failed:
          type: "number"
          format: "int32"
        skipped:
          type: "number"
          format: "int32"
          description: "Records that matched the filter but were excluded or not in an applicable status"
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/BulkActionError"
            type: "object"
          description: "One entry per failed record (empty when failed is 0)"
        nextCursor:
          type: "string"
          description: "Resume cursor for the next chunk (the largest record id processed this call); empty when done"
        done:
          type: "boolean"
          description: "True when no more records matched this chunk (the walk is complete)"
      required:
        - "requested"
        - "succeeded"
        - "failed"
        - "skipped"
        - "errors"
        - "nextCursor"
        - "done"

    FieldSortDirection:
      type: "string"
      enum:
        - "Ascending"
        - "Descending"

    FieldSort:
      type: "object"
      properties:
        field:
          type: "string"
          example: "classification"
        direction:
          $ref: "#/components/schemas/FieldSortDirection"
          type: "object"
      required:
        - "field"
        - "direction"

    GenomicQueryMode:
      type: "string"
      enum:
        - "Exact"
        - "Overlaps"
        - "Contains"
        - "Within"

    GenomicRegion:
      type: "object"
      properties:
        chr:
          type: "string"
          example: "X"
        start:
          type: "number"
          format: "int32"
          example: 100
        stop:
          type: "number"
          format: "int32"
          example: 200
      required:
        - "chr"
        - "start"
        - "stop"

    GenomicQuery:
      type: "object"
      properties:
        mode:
          $ref: "#/components/schemas/GenomicQueryMode"
          type: "object"
        query:
          type: "array"
          items:
            $ref: "#/components/schemas/GenomicRegion"
            type: "object"
      required:
        - "mode"
        - "query"

    InputData:
      type: "object"
      properties:
        values:
          type: "array"
          items:
            type: "array"
            items:
              type: "object"
        objects:
          type: "array"
          items:
            type: "object"

    GenePreferenceImportRecord:
      type: "object"
      properties:
        geneId:
          type: "string"
          description: "Entrez GeneID; when present it keys the record directly"
        transcriptId:
          type: "string"
          description: "Transcript accession (RefSeq/Ensembl); narrows the locus to this transcript, and on its own resolves the gene"
        geneName:
          type: "string"
          description: "Gene symbol; exact case-insensitive fallback used when no id is given"
        fields:
          type: "object"
          description: "Remaining GenePreferences columns keyed by field symbol (PreferredTranscript, PreferredDisorder, PreferredInheritance, Notes, ...)"

    GeneListImportRecord:
      type: "object"
      properties:
        uuid:
          type: "string"
          description: "List primary key; a new one is generated when omitted"
        name:
          type: "string"
        description:
          type: "string"
        sourceName:
          type: "string"
        sourceUrl:
          type: "string"
        geneIds:
          type: "array"
          items:
            type: "string"
          description: "Member genes given as Entrez GeneIDs"
        transcriptIds:
          type: "array"
          items:
            type: "string"
          description: "Member genes given as transcript accessions"
        geneNames:
          type: "array"
          items:
            type: "string"
          description: "Member genes given as gene symbols"
      required:
        - "name"

    OperatorType:
      type: "string"
      enum:
        - "Or"
        - "And"
        - "Not"
        - "Equals"
        - "NotEquals"
        - "LessThan"
        - "LessThanOrEqual"
        - "GreaterThan"
        - "GreaterThanOrEqual"
        - "StartsWith"
        - "EndsWith"
        - "Substring"
        - "IsNull"
        - "IsNotNull"
        - "AlignedArrayMatch"

    ExpressionNode:
      type: "object"
      properties:
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/ExpressionNode"
            type: "object"
          description: "Used by And, Or, Not, and AlignedArrayMatch."
        field:
          type: "string"
          example: "classification"
        op:
          $ref: "#/components/schemas/OperatorType"
          type: "object"
          description: "And, Or, Not, Equals, NotEquals, LessThan, LessThanOrEqual, GreaterThan, GreaterThanOrEqual, StartsWith, EndsWith, Substring, IsNull, IsNotNull, AlignedArrayMatch"
        value:
          type: "string"
          example: "Pathogenic"
      required:
        - "op"
