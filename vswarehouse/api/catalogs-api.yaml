      x-agent-cost: "cheap"
      x-agent-permission: "catalog:write"
      x-agent-returns-process: true
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "inputPath"
              properties:
                delimiter:
                  type: "string"
                  description: "Field delimiter override. Auto-detected from the extension by default (tab for .tsv, comma for .csv); set to \",\" or \"\\t\" to force it."
                listDelimiter:
                  type: "string"
                  description: "Delimiter that separates multiple values within a single list-typed field, if any."
                fieldMapping:
                  type: "object"
                  description: "Object mapping each input column symbol (from preview:gaSourceMeta) to the target catalog field symbol (from catalogs:catalogInfo), e.g. { \"chromosome\": \"chr\", \"gene_symbol\": \"gene\" }. Omit to auto-map input columns to catalog fields whose symbols match."
                inputPath:
                  type: "string"
                  example: "Documents/Uploads/variants.tsv"
                  description: "Workspace-relative path to the delimited-text input file"
                authorUserIdOrEmail:
                  type: "string"
                  description: "If set, attribute every imported record to this user id or email instead of the calling user (e.g. a baseline authority such as 'goldenhelix'). authorFullName should also be set."
                authorFullName:
                  type: "string"
                  description: "Display name paired with authorUserIdOrEmail for imported-record attribution."
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                type: "string"
