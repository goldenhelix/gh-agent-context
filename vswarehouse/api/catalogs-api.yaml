  /source/{catalogId}/bulkAction:
    post:
      operationId: "catalogBulkAction"
      summary: "Apply a lifecycle action to every record matching a filter"
      description: "Server-side bulk equivalent of the per-record lifecycle actions. The filter (genomicQuery / filterTree / queryMode) selects the full record set - not just a loaded page - and the action is applied to every match whose latest version is in an applicable status. recordIds listed in excludeRecordIds are skipped, which supports the select-all-then-deselect UI flow. ConfirmDeletion additionally requires the catalog publish permission. Returns a summary with per-record errors; a failure on one record does not abort the batch."
      x-agent-expose: "hidden"
      x-agent-permission: "catalog:write"
      parameters:
        - name: "catalogId"
          in: "path"
          required: true
          schema:
            type: "string"

      requestBody:
        required: "true"
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "action"
              properties:
                action:
                  $ref: "#/components/schemas/CatalogBulkActionType"
                  type: "object"
                genomicQuery:
                  $ref: "#/components/schemas/GenomicQuery"
                  type: "object"
                filterTree:
                  $ref: "#/components/schemas/ExpressionNode"
                  type: "object"
                queryMode:
                  $ref: "#/components/schemas/CatalogQueryMode"
                  type: "object"
                excludeRecordIds:
                  type: "array"
                  items:
                    type: "string"
                assignToId:
                  type: "string"
                  description: "For the Assign action - the assignee user/group id (empty clears the assignment)"
                assignToName:
                  type: "string"
                  description: "For the Assign action - the assignee display name"
                limit:
                  type: "number"
                  format: "int32"
                  description: "Max records to process this call. Chunked walk - call repeatedly with afterRecordId until done. Omit/0 processes the whole set in one call."
                afterRecordId:
                  type: "string"
                  description: "Keyset cursor - only process records whose id is greater (pass the previous response's nextCursor)"
      responses:
        200:
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"
                type: "object"
